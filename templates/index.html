<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Support Location Véhicules</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .chat-container {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #2563eb;
      color: white;
      padding: 18px;
      text-align: center;
    }

    .name {
      font-size: 20px;
      font-weight: bold;
    }

    .status {
      font-size: 13px;
      margin-top: 4px;
      opacity: 0.9;
    }

    .messages {
      flex: 1;
      padding: 15px;
      overflow-y: auto;
    }

    .message {
      max-width: 80%;
      padding: 13px 15px;
      border-radius: 18px;
      margin-bottom: 12px;
      font-size: 16px;
      line-height: 1.4;
      word-wrap: break-word;
    }

    .user {
      background: #2563eb;
      color: white;
      margin-left: auto;
      border-bottom-right-radius: 5px;
    }

    .bot {
      background: #e5e7eb;
      color: #111827;
      margin-right: auto;
      border-bottom-left-radius: 5px;
    }

    .input-area {
      border-top: 1px solid #e5e7eb;
      padding: 12px;
      background: white;
      display: flex;
      gap: 10px;
      align-items: center;
    }

    input {
      flex: 1;
      padding: 14px;
      border-radius: 25px;
      border: 1px solid #d1d5db;
      outline: none;
      font-size: 16px;
    }

    button {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      border: none;
      background: #2563eb;
      color: white;
      font-size: 22px;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.96);
    }

    .hint {
      font-size: 12px;
      text-align: center;
      color: #6b7280;
      padding-bottom: 8px;
    }
  </style>
</head>

<body>

  <div class="chat-container">
    <div class="header">
      <div class="name">Support Location Véhicules</div>
      <div class="status">Réponse instantanée • 24h/24</div>
    </div>

    <div class="messages" id="messages">
      <div class="message bot">
        Bonjour 👋 Je suis votre assistant location. Posez-moi votre question.
      </div>
    </div>

    <div class="input-area">
      <input
        type="text"
        id="userInput"
        placeholder="Écrivez votre message..."
        autocomplete="off"
      />
      <button onclick="sendMessage()">➤</button>
    </div>

    <div class="hint">Appuyez sur Entrée pour envoyer votre message</div>
  </div>

  <script>
    const faq = [
      {
        title: "âge minimum",
        keywords: [
          "age minimum", "âge minimum", "quel age", "quel âge",
          "21 ans", "avoir quel age", "avoir quel âge",
          "permis", "jeune conducteur"
        ],
        answer: "L'âge minimum requis est de 21 ans avec un permis valide."
      },
      {
        title: "carburant essence",
        keywords: [
          "quelle essence", "quel essence", "carburant",
          "type essence", "type de carburant", "sp95", "sp98",
          "sans plomb", "diesel", "gazole", "pompe",
          "plein", "mettre comme essence"
        ],
        answer: "Le type de carburant est indiqué sur la trappe à carburant ou sur le contrat de location. En cas de doute, contactez-nous avant de faire le plein."
      },
      {
        title: "niveau carburant retour",
        keywords: [
          "rendre avec le plein", "restituer avec le plein",
          "niveau de carburant", "même niveau", "retour carburant",
          "je dois remettre le plein", "plein au retour"
        ],
        answer: "Le véhicule doit être restitué avec le même niveau de carburant qu'au départ."
      },
      {
        title: "prix location",
        keywords: [
          "prix", "tarif", "combien", "coût", "cout",
          "ça coûte combien", "location coûte"
        ],
        answer: "Les tarifs dépendent du véhicule, de la durée de location et des options choisies. Indiquez-nous le modèle souhaité et la durée pour obtenir un prix précis."
      },
      {
        title: "caution",
        keywords: [
          "caution", "dépôt de garantie", "depot de garantie",
          "empreinte bancaire", "bloqué sur la carte", "blocage carte"
        ],
        answer: "Une caution peut être demandée avant le départ. Elle est restituée après le retour du véhicule si aucun dommage n'est constaté."
      },
      {
        title: "documents",
        keywords: [
          "document", "documents", "papier", "papiers",
          "pièce d'identité", "piece d'identite", "cni",
          "permis de conduire", "justificatif"
        ],
        answer: "Pour louer un véhicule, il faut généralement une pièce d'identité, un permis de conduire valide et une carte bancaire."
      },
      {
        title: "assurance",
        keywords: [
          "assurance", "assuré", "assuree", "accident",
          "franchise", "dommage", "rayure", "vol"
        ],
        answer: "Le véhicule est assuré selon les conditions du contrat. Une franchise peut s'appliquer en cas de dommage, accident ou vol."
      },
      {
        title: "retard",
        keywords: [
          "retard", "je suis en retard", "rendre en retard",
          "heure de retour dépassée", "depasser l'heure"
        ],
        answer: "En cas de retard, prévenez-nous rapidement. Des frais supplémentaires peuvent s'appliquer selon la durée du dépassement."
      },
      {
        title: "kilométrage",
        keywords: [
          "kilomètre", "kilometre", "km", "kilométrage",
          "kilometrage", "illimité", "limite kilométrique"
        ],
        answer: "Le kilométrage autorisé dépend de l'offre choisie. Il peut être limité ou illimité selon le contrat."
      },
      {
        title: "réservation",
        keywords: [
          "réserver", "reserver", "réservation", "reservation",
          "disponible", "disponibilité", "disponibilite",
          "je veux louer"
        ],
        answer: "Pour réserver, indiquez-nous la date, l'heure, la durée souhaitée et le véhicule voulu."
      },
      {
        title: "annulation",
        keywords: [
          "annuler", "annulation", "remboursement",
          "je veux annuler", "modifier réservation",
          "modifier reservation"
        ],
        answer: "Une réservation peut être modifiée ou annulée selon les conditions prévues lors de la réservation."
      },
      {
        title: "paiement",
        keywords: [
          "payer", "paiement", "carte bancaire",
          "espèces", "especes", "virement", "acompte"
        ],
        answer: "Le paiement peut généralement se faire par carte bancaire. Un acompte peut être demandé pour confirmer la réservation."
      }
    ];

    function normalizeText(text) {
      return text
        .toLowerCase()
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^\w\s]/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function wordIncluded(message, keyword) {
      const cleanMessage = normalizeText(message);
      const cleanKeyword = normalizeText(keyword);

      const regex = new RegExp("\\b" + cleanKeyword.replace(/\s+/g, "\\s+") + "\\b", "i");
      return regex.test(cleanMessage);
    }

    function getBotResponse(message) {
      let bestMatch = null;
      let bestScore = 0;

      for (const item of faq) {
        let score = 0;

        for (const keyword of item.keywords) {
          if (wordIncluded(message, keyword)) {
            score++;
          }
        }

        if (score > bestScore) {
          bestScore = score;
          bestMatch = item;
        }
      }

      if (bestScore > 0) {
        return bestMatch.answer;
      }

      return "Je n'ai pas bien compris votre question. Pouvez-vous reformuler ou préciser votre demande ?";
    }

    function addMessage(text, sender) {
      const messages = document.getElementById("messages");
      const messageDiv = document.createElement("div");

      messageDiv.className = "message " + sender;
      messageDiv.textContent = text;

      messages.appendChild(messageDiv);
      messages.scrollTop = messages.scrollHeight;
    }

    function sendMessage() {
      const input = document.getElementById("userInput");
      const userText = input.value.trim();

      if (userText === "") return;

      addMessage(userText, "user");
      input.value = "";

      setTimeout(() => {
        const botResponse = getBotResponse(userText);
        addMessage(botResponse, "bot");
      }, 400);
    }

    document.getElementById("userInput").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
