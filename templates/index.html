<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Location Véhicules</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 430px;
            height: 620px;
            margin: 35px auto;
            background: white;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #111827;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            flex-shrink: 0;
        }

        .name {
            font-weight: bold;
            font-size: 16px;
        }

        .status {
            font-size: 12px;
            color: #d1d5db;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            width: fit-content;
            max-width: 78%;
            padding: 11px 15px;
            margin: 9px 0;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 14px;
            word-wrap: break-word;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .bot {
            background: #e5e7eb;
            color: #111827;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .input-area {
            display: flex;
            align-items: center;
            padding: 12px;
            border-top: 1px solid #e5e7eb;
            background: white;
            gap: 8px;
        }

        input {
            flex: 1;
            min-width: 0;
            padding: 13px 16px;
            border: 1px solid #2563eb;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        button {
            width: 46px;
            height: 46px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 17px;
            flex-shrink: 0;
        }

        .footer-note {
            font-size: 11px;
            text-align: center;
            color: #6b7280;
            padding-bottom: 8px;
            background: white;
        }

        .password-box {
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 18px;
            text-align: center;
        }

        .password-message {
            background: #e5e7eb;
            color: #111827;
            padding: 18px 22px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.4;
            font-size: 15px;
        }

        .password-row {
            width: 85%;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .password-input-wrapper {
            flex: 1;
            position: relative;
        }

        .password-input-wrapper input {
            width: 100%;
            padding-right: 45px;
        }

        .eye-button {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            width: 34px;
            height: 34px;
            background: transparent;
            color: #2563eb;
            font-size: 16px;
        }

        .send-password-button {
            background: #2563eb;
        }

        .error {
            color: #dc2626;
            margin-top: 4px;
            font-weight: bold;
            display: none;
            font-size: 14px;
        }

        @media (max-width: 500px) {
            .chat-container {
                width: 95%;
                height: 90vh;
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">S</div>
        <div>
            <div class="name">Support Location Véhicules</div>
            <div class="status">Réponse instantanée • 24h/24</div>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div id="passwordSection" class="password-box">
            <div class="password-message">
                Bienvenue.<br><br>
                Veuillez entrer le mot de passe pour accéder au chatbot.
            </div>

            <div class="password-row">
                <div class="password-input-wrapper">
                    <input type="password" id="passwordInput" placeholder="Mot de passe">
                    <button class="eye-button" onclick="togglePassword()">👁</button>
                </div>

                <button class="send-password-button" onclick="checkPassword()">➤</button>
            </div>

            <div id="errorMessage" class="error">Mot de passe incorrect</div>
        </div>
    </div>

    <div class="input-area" id="inputArea" style="display: none;">
        <input type="text" id="message" placeholder="Écrivez votre message...">
        <button onclick="sendMessage()">➤</button>
    </div>

    <div class="footer-note">
        Appuyez sur Entrée pour envoyer votre message
    </div>
</div>

<script>
const chatBox = document.getElementById("chatBox");
const inputArea = document.getElementById("inputArea");

function togglePassword() {
    const passwordInput = document.getElementById("passwordInput");

    if (passwordInput.type === "password") {
        passwordInput.type = "text";
    } else {
        passwordInput.type = "password";
    }
}

async function checkPassword() {
    let password = document.getElementById("passwordInput").value.trim();
    let errorMessage = document.getElementById("errorMessage");

    let response = await fetch("/verifier-mdp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: password })
    });

    let data = await response.json();

    if (data.success) {
        chatBox.innerHTML = `
            <div class="message bot">
                Bienvenue.<br><br>
                Je suis Paul, votre assistant virtuel.<br>
                Je suis à votre disposition pour répondre à toutes vos questions concernant la location de nos véhicules.
            </div>
        `;

        inputArea.style.display = "flex";
        document.getElementById("message").focus();
    } else {
        errorMessage.style.display = "block";
    }
}

document.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        const passwordInput = document.getElementById("passwordInput");
        const messageInput = document.getElementById("message");

        if (passwordInput && document.activeElement === passwordInput) {
            checkPassword();
        } else if (messageInput && document.activeElement === messageInput) {
            sendMessage();
        }
    }
});

async function sendMessage() {
    let input = document.getElementById("message");
    let message = input.value.trim();

    if (message === "") return;

    addMessage(message, "user");
    input.value = "";

    addMessage("Paul écrit...", "bot", true);

    try {
        let response = await fetch("/chat", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message })
        });

        let data = await response.json();

        removeTypingMessage();
        addMessage(data.reply, "bot");
    } catch {
        removeTypingMessage();
        addMessage("Une erreur est survenue. Merci de réessayer.", "bot");
    }
}

function addMessage(text, sender, typing = false) {
    let msg = document.createElement("div");
    msg.classList.add("message", sender);

    if (typing) msg.id = "typing";

    msg.innerText = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTypingMessage() {
    let typing = document.getElementById("typing");
    if (typing) typing.remove();
}
</script>

</body>
</html>
