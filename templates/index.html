<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Kevin - Assistant Location</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eef2f7;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 430px;
            height: 620px;
            margin: 35px auto;
            background: white;
            border-radius: 22px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #111827;
            color: white;
            padding: 18px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar {
            width: 42px;
            height: 42px;
            background: #2563eb;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
        }

        .header-text {
            text-align: left;
        }

        .header-text .name {
            font-weight: bold;
            font-size: 16px;
        }

        .header-text .status {
            font-size: 12px;
            color: #d1d5db;
        }

        .chat-box {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            max-width: 78%;
            padding: 11px 15px;
            margin: 9px 0;
            border-radius: 18px;
            line-height: 1.4;
            font-size: 14px;
            clear: both;
            word-wrap: break-word;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }

        .bot {
            background: #e5e7eb;
            color: #111827;
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }

        .input-area {
            display: flex;
            align-items: center;
            padding: 13px;
            border-top: 1px solid #e5e7eb;
            background: white;
        }

        input {
            flex: 1;
            padding: 13px 16px;
            border: 1px solid #d1d5db;
            border-radius: 25px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #2563eb;
        }

        button {
            margin-left: 8px;
            padding: 12px 16px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .footer-note {
            font-size: 11px;
            text-align: center;
            color: #6b7280;
            padding-bottom: 8px;
            background: white;
        }

        @media (max-width: 500px) {
            .chat-container {
                width: 95%;
                height: 90vh;
                margin: 20px auto;
            }
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="chat-header">
        <div class="avatar">K</div>
        <div class="header-text">
            <div class="name">Kevin - Assistant Location</div>
            <div class="status">En ligne • Réponse instantanée</div>
        </div>
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Bienvenue <br><br>
            Je suis Kevin, votre assistant virtuel.<br>
            Je suis là pour répondre à vos questions concernant la location du véhicule.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="message" placeholder="Écrivez votre message...">
        <button onclick="sendMessage()">➤</button>
    </div>

    <div class="footer-note">
        Appuyez sur Entrée pour envoyer votre message
    </div>
</div>

<script>
const input = document.getElementById("message");
const chatBox = document.getElementById("chatBox");

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

async function sendMessage() {
    let message = input.value.trim();

    if (message === "") {
        return;
    }

    addMessage(message, "user");
    input.value = "";

    addMessage("Kevin écrit...", "bot", true);

    let response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    let data = await response.json();

    removeTypingMessage();
    addMessage(data.reply, "bot");
}

function addMessage(text, sender, typing = false) {
    let msg = document.createElement("div");
    msg.classList.add("message", sender);

    if (typing) {
        msg.id = "typing";
    }

    msg.innerHTML = text;
    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function removeTypingMessage() {
    let typing = document.getElementById("typing");
    if (typing) {
        typing.remove();
    }
}
</script>

</body>
</html>
