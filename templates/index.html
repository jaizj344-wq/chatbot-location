<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chatbot Location</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 0;
        }

        .chat-container {
            width: 420px;
            height: 600px;
            margin: 40px auto;
            background: white;
            border-radius: 18px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: #111827;
            color: white;
            padding: 18px;
            text-align: center;
            font-weight: bold;
        }

        .chat-box {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #f9fafb;
        }

        .message {
            max-width: 75%;
            padding: 10px 14px;
            margin: 8px 0;
            border-radius: 16px;
            line-height: 1.4;
            font-size: 14px;
            clear: both;
        }

        .user {
            background: #2563eb;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .bot {
            background: #e5e7eb;
            color: #111827;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .input-area {
            display: flex;
            padding: 12px;
            border-top: 1px solid #ddd;
            background: white;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }

        button {
            margin-left: 8px;
            padding: 12px 16px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 20px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }
    </style>
</head>

<body>

<div class="chat-container">
    <div class="chat-header">
        Assistant Location 🚗
    </div>

    <div class="chat-box" id="chatBox">
        <div class="message bot">
            Bonjour 👋 Posez-moi une question sur la location du véhicule.
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="message" placeholder="Écrivez votre message...">
        <button onclick="sendMessage()">Envoyer</button>
    </div>
</div>

<script>
const input = document.getElementById("message");
const chatBox = document.getElementById("chatBox");

input.addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        sendMessage();
    }
});

async function sendMessage() {
    let message = input.value.trim();

    if (message === "") {
        return;
    }

    addMessage(message, "user");
    input.value = "";

    let response = await fetch("/chat", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ message: message })
    });

    let data = await response.json();

    addMessage(data.reply, "bot");
}

function addMessage(text, sender) {
    let msg = document.createElement("div");
    msg.classList.add("message", sender);
    msg.innerText = text;

    chatBox.appendChild(msg);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
